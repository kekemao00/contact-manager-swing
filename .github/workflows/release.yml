name: Release

# 推送 v* 标签（如 v1.2.0）时自动构建并发布 GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 构建可运行 jar
        run: mvn -B -ntp verify -Drevision=${{ steps.ver.outputs.version }}

      - name: 重命名产物
        run: cp target/contact-manager-swing.jar contact-manager-swing-${{ steps.ver.outputs.version }}.jar

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: contact-manager-swing-*.jar

  windows:
    needs: jar
    runs-on: windows-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: input

      # 用 jpackage 生成内嵌 JRE 的免安装程序，无需用户安装 Java
      - name: 打包 Windows 绿色版
        shell: pwsh
        run: |
          $version = "${{ needs.jar.outputs.version }}"
          $appVersion = ($version -split '-')[0]
          jpackage --type app-image `
            --input input `
            --main-jar "contact-manager-swing-$version.jar" `
            --main-class me.kekemao.Main `
            --name ContactManager `
            --app-version $appVersion `
            --vendor kekemao `
            --dest dist
          Compress-Archive -Path dist/ContactManager -DestinationPath "ContactManager-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ContactManager-*-windows-x64.zip

  release:
    needs: [jar, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            "${flags[@]}"
