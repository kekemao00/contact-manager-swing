name: Release

# 推送 v* 标签（如 v1.2.0）时自动构建并发布 GitHub Release；
# 也可在 Actions 页面手动运行，填入版本号后由 Release 自动在当前提交上创建标签
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 2.0.0（带 - 的为预发布版本，如 2.1.0-beta.1）'
        required: true

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号格式不正确：$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: 构建可运行 jar
        run: mvn -B -ntp verify -Drevision=${{ steps.ver.outputs.version }}

      - name: 重命名产物
        run: cp target/contact-manager-swing.jar contact-manager-swing-${{ steps.ver.outputs.version }}.jar

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: contact-manager-swing-*.jar

  windows:
    needs: jar
    runs-on: windows-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: input

      # 用 jpackage 生成内嵌 JRE 的免安装程序，无需用户安装 Java
      - name: 打包 Windows 绿色版
        shell: pwsh
        run: |
          $version = "${{ needs.jar.outputs.version }}"
          $appVersion = ($version -split '-')[0]
          jpackage --type app-image `
            --input input `
            --main-jar "contact-manager-swing-$version.jar" `
            --main-class me.kekemao.Main `
            --name ContactManager `
            --app-version $appVersion `
            --vendor kekemao `
            --dest dist
          Compress-Archive -Path dist/ContactManager -DestinationPath "ContactManager-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ContactManager-*-windows-x64.zip

  release:
    needs: [jar, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.jar.outputs.tag }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          # 手动运行时标签尚不存在，由 Release 在本次构建的提交上创建
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${flags[@]}"
